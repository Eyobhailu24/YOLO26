<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="theme-color" content="#205941" />
    <meta
      name="description"
      content="Upload an image and explore YOLO26 object detection with Vision Studio."
    />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <script>
      try {
        const theme = localStorage.getItem("yolo26-theme");
        document.documentElement.classList.toggle(
          "dark",
          theme === "dark" ||
            (theme !== "light" &&
              matchMedia("(prefers-color-scheme: dark)").matches),
        );
      } catch {
        document.documentElement.classList.toggle(
          "dark",
          matchMedia("(prefers-color-scheme: dark)").matches,
        );
      }
    </script>
    <title>YOLO26 · Vision Studio</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
